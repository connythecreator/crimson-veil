[package]
name = "crimson-veil-kiosk"
version = "0.1.0"
edition = "2021"
description = "Crimson Veil native EIT kiosk (eframe/egui), talking to the Python control service over a localhost WebSocket."
license = "MIT"

[[bin]]
name = "crimson-veil-kiosk"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }
egui = "0.31"
ewebsock = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
