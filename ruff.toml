target-version = "py311"
line-length = 100

exclude = [".venv", "docs"]

[lint]
select = ["E", "F", "I", "B", "UP"]

[lint.per-file-ignores]
# gui.py manipulates sys.path before importing, so imports necessarily follow
# executable statements.
"apps/kiosk/gui.py" = ["E402"]
# test_pyeit_project.py guards optional pyEIT/numpy/matplotlib imports with
# importorskip, so imports necessarily follow executable statements.
"tests/test_pyeit_project.py" = ["E402", "I001"]
